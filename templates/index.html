<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Meshtastic Web Interface</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; }
        #messages { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 20px; }
        .message { margin: 5px 0; padding: 5px; background: #f0f0f0; }
        #messageInput { width: 70%; padding: 5px; }
        button { padding: 5px 15px; }
    </style>
</head>
<body>
    <h1>Meshtastic Messages</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');

        socket.on('new_message', (data) => {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = `[${data.time}] From ${data.from}: ${data.text}`;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) {
                socket.emit('send_message', { text: text });
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
