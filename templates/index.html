<!DOCTYPE html>
<html>
<head>
    <title>Meshtastic Web Interface</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 { color: #4ec9b0; }
        #messages {
            border: 1px solid #555;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 20px;
            background: #252526;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            background: #2d2d30;
            border-left: 3px solid #4ec9b0;
        }
        #messageInput {
            width: 70%;
            padding: 8px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
        }
        button {
            padding: 8px 15px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <h1>🛰️ Meshtastic Messages</h1>
    <div id="messages"></div>
    <div style="margin-bottom: 10px;">
        <label for="recipient">To: </label>
        <select id="recipient" style="padding: 8px; background: #3c3c3c; border: 1px solid #555; color: #d4d4d4;">
            <option value="channel">📡 MediumFast Channel (Public)</option>
        </select>
    </div>
    <input type="text" id="messageInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const recipientSelect = document.getElementById('recipient');

        // Format Unix timestamp to readable time
        function formatTime(unixTime) {
            const date = new Date(unixTime * 1000);
            const options = {
                timeZone: 'America/Los_Angeles',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return date.toLocaleString('en-US', options);
        }

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('get_nodes');  // Request node list on connect
        });

        socket.on('node_list', (data) => {
            console.log('Received nodes:', data.nodes);
            // Clear current DM options (keep channel option)
            const channelOption = recipientSelect.querySelector('option[value="channel"]');
            recipientSelect.innerHTML = '';
            recipientSelect.appendChild(channelOption);

            // Add node options
            data.nodes.forEach(node => {
                console.log('Node data:', node);
                const option = document.createElement('option');
                const shortName = node.user?.shortName;
                const longName = node.user?.longName;
                console.log(`Node ${node.num}: shortName=${shortName}, longName=${longName}`);
                let userName;
                if (shortName && longName) {
                    userName = `${shortName} (${longName}) - Node ${node.num}`;
                } else if (longName) {
                    userName = `${longName} - Node ${node.num}`;
                } else if (shortName) {
                    userName = `${shortName} - Node ${node.num}`;
                } else {
                    userName = `Node ${node.num}`;
                }
                option.value = node.num;
                option.textContent = `💬 DM: ${userName}`;
                recipientSelect.appendChild(option);
            });
        });

        socket.on('new_message', (data) => {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            const timeStr = data.time !== 'unknown' ? formatTime(data.time) : 'unknown time';
            msgEl.textContent = `[${timeStr}] From ${data.from}: ${data.text}`;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const recipient = recipientSelect.value;

            if (text) {
                socket.emit('send_message', {
                    text: text,
                    recipient: recipient
                });

                // Show your own message immediately
                const msgEl = document.createElement('div');
                msgEl.className = 'message';
                msgEl.style.borderLeftColor = '#ce9178';
                const recipientText = recipient === 'channel' ? 'Channel' : recipientSelect.options[recipientSelect.selectedIndex].text.replace('💬 DM: ', '');
                const now = new Date();
                const timeStr = now.toLocaleString('en-US', {
                    timeZone: 'America/Los_Angeles',
                    month: 'short',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                msgEl.textContent = `[${timeStr}] You → ${recipientText}: ${text}`;
                messagesDiv.appendChild(msgEl);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Refresh node list every 30 seconds
        setInterval(() => {
            socket.emit('get_nodes');
        }, 30000);
    </script>
</body>
</html>
