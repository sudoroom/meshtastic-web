<!DOCTYPE html>
<html>
<head>
    <title>Meshtastic Web Interface</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 { color: #4ec9b0; }
        #messages {
            border: 1px solid #555;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 20px;
            background: #252526;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            background: #2d2d30;
            border-left: 3px solid #4ec9b0;
        }
        #messageInput {
            width: 70%;
            padding: 8px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
        }
        button {
            padding: 8px 15px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #1177bb;
        }
    </style>
</head>
<body>
    <h1>🛰️ Meshtastic Messages</h1>
    <div id="messages"></div>
    <input type="text" id="messageInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');

        socket.on('connect', () => {
            console.log('Connected to server');
        });

        socket.on('new_message', (data) => {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = `[${data.time}] From ${data.from}: ${data.text}`;
            messagesDiv.appendChild(msgEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text) {
                socket.emit('send_message', { text: text });

                // Show your own message immediately
                const msgEl = document.createElement('div');
                msgEl.className = 'message';
                msgEl.style.borderLeftColor = '#ce9178';
                msgEl.textContent = `[sent] You: ${text}`;
                messagesDiv.appendChild(msgEl);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
