<!DOCTYPE html>
<html>
<head>
    <title>Meshtastic Web Interface</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: #2d2d30;
            padding: 15px 20px;
            border-bottom: 1px solid #555;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        h1 {
            color: #4ec9b0;
            font-size: 1.5em;
            margin-right: auto;
        }
        .mode-buttons {
            display: flex;
            gap: 10px;
        }
        .mode-btn {
            padding: 8px 20px;
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:hover {
            background: #4a4a4a;
        }
        .mode-btn.active {
            background: #0e639c;
            border-color: #0e639c;
        }
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: #252526;
            border-right: 1px solid #555;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            background: #2d2d30;
            border-bottom: 1px solid #555;
            font-weight: bold;
            color: #4ec9b0;
        }
        .sidebar-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #3c3c3c;
            transition: background 0.2s;
        }
        .sidebar-item:hover {
            background: #2d2d30;
        }
        .sidebar-item.active {
            background: #0e639c;
            border-left: 3px solid #4ec9b0;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 15px 20px;
            background: #2d2d30;
            border-bottom: 1px solid #555;
            font-weight: bold;
            color: #4ec9b0;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #1e1e1e;
        }
        .message {
            margin: 10px 0;
            padding: 8px 12px;
            background: #2d2d30;
            border-left: 3px solid #4ec9b0;
            border-radius: 3px;
        }
        .message.dm {
            border-left-color: #ce9178;
        }
        .message.outgoing {
            border-left-color: #569cd6;
        }
        .message span[title] {
            cursor: help;
            text-decoration: underline dotted;
            text-decoration-color: #888;
        }
        .message-status {
            float: right;
            font-size: 0.85em;
            margin-left: 10px;
            opacity: 0.7;
        }
        .message-status.pending {
            color: #dcdcaa;
        }
        .message-status.ack {
            color: #4ec9b0;
        }
        .message-status.nak {
            color: #f48771;
        }
        .message-input-area {
            padding: 15px 20px;
            background: #2d2d30;
            border-top: 1px solid #555;
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            font-family: monospace;
        }
        #messageInput:focus {
            outline: none;
            border-color: #0e639c;
        }
        .send-btn {
            padding: 10px 20px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
            font-family: monospace;
            transition: background 0.2s;
        }
        .send-btn:hover {
            background: #1177bb;
        }
        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            font-size: 1.2em;
        }
        .new-dm-btn {
            padding: 12px 15px;
            background: #0e639c;
            color: white;
            border: none;
            cursor: pointer;
            font-family: monospace;
            transition: background 0.2s;
            border-bottom: 1px solid #555;
            text-align: left;
            width: 100%;
        }
        .new-dm-btn:hover {
            background: #1177bb;
        }
        .node-select-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #3c3c3c;
            transition: background 0.2s;
            font-size: 0.9em;
        }
        .node-select-item:hover {
            background: #2d2d30;
        }
        .node-select-item .node-short {
            font-weight: bold;
            color: #4ec9b0;
        }
        .node-select-item .node-long {
            color: #888;
            font-size: 0.85em;
        }
        .node-filter-input {
            padding: 10px;
            background: #3c3c3c;
            border: 1px solid #555;
            border-bottom: 2px solid #0e639c;
            color: #d4d4d4;
            font-family: monospace;
            width: 100%;
            font-size: 0.9em;
        }
        .node-filter-input:focus {
            outline: none;
            border-bottom-color: #1177bb;
        }
        .node-filter-input::placeholder {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛰️ Meshtastic</h1>
            <div class="mode-buttons">
                <button class="mode-btn active" onclick="switchMode('channels')">📡 Channels</button>
                <button class="mode-btn" onclick="switchMode('dms')">💬 DMs</button>
            </div>
        </div>

        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header" id="sidebar-header">Channels</div>
                <div id="sidebar-items">
                    <!-- Sidebar items will be populated dynamically -->
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="chat-header">Select a channel or DM</div>
                <div class="messages-container" id="messages">
                    <div class="empty-state">Select a channel or DM to start messaging</div>
                </div>
                <div class="message-input-area">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const messagesContainer = document.getElementById('messages');
        const chatHeader = document.getElementById('chat-header');
        const sidebarHeader = document.getElementById('sidebar-header');
        const sidebarItems = document.getElementById('sidebar-items');
        const messageInput = document.getElementById('messageInput');

        // State management
        let currentMode = 'channels'; // 'channels' or 'dms'
        let currentSelection = null; // channel index or node number
        let myNodeNumber = null;
        let channelMap = {};
        let nodeMap = {};
        let allMessages = []; // Store all messages for filtering
        let dmMessages = []; // Store DM messages separately (may go further back in history)
        let showingNodeSelect = false; // Track if we're showing node selection
        let messageStatus = {}; // Track message status by packet_id: {packet_id: 'pending'|'ack'|'nak'}

        // Switch between Channels and DMs mode
        function switchMode(mode) {
            currentMode = mode;
            currentSelection = null;

            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update sidebar header
            sidebarHeader.textContent = mode === 'channels' ? 'Channels' : 'Direct Messages';

            // Rebuild sidebar
            rebuildSidebar();

            // Clear chat area
            chatHeader.textContent = mode === 'channels' ? 'Select a channel' : 'Select a DM';
            messagesContainer.innerHTML = '<div class="empty-state">Select a ' + (mode === 'channels' ? 'channel' : 'DM') + ' to start messaging</div>';
        }

        // Rebuild sidebar based on current mode
        function rebuildSidebar() {
            sidebarItems.innerHTML = '';
            showingNodeSelect = false;

            if (currentMode === 'channels') {
                // Add channel items
                Object.keys(channelMap).forEach(index => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item';
                    item.textContent = `📡 ${channelMap[index]}`;
                    item.onclick = () => selectChannel(parseInt(index));
                    sidebarItems.appendChild(item);
                });
            } else {
                // Add "New DM" button
                const newDmBtn = document.createElement('button');
                newDmBtn.className = 'new-dm-btn';
                newDmBtn.textContent = '➕ New DM';
                newDmBtn.onclick = showNodeSelector;
                sidebarItems.appendChild(newDmBtn);

                // Add DM items - get unique DM participants (excluding ourselves)
                // Use dmMessages which queries DMs specifically (not limited to last 100 overall messages)
                const dmParticipants = new Set();
                dmMessages.forEach(msg => {
                    // For each DM, add the OTHER person (not ourselves)
                    if (msg.from === myNodeNumber && msg.to !== myNodeNumber && msg.to !== 4294967295) {
                        // We sent this DM, add the recipient
                        dmParticipants.add(msg.to);
                    } else if (msg.to === myNodeNumber && msg.from !== myNodeNumber) {
                        // We received this DM, add the sender
                        dmParticipants.add(msg.from);
                    }
                });

                dmParticipants.forEach(nodeNum => {
                    const item = document.createElement('div');
                    item.className = 'sidebar-item';
                    item.textContent = `💬 ${getNodeDisplayName(nodeNum)}`;
                    item.onclick = () => selectDM(nodeNum);
                    sidebarItems.appendChild(item);
                });

                if (dmParticipants.size === 0) {
                    const empty = document.createElement('div');
                    empty.style.padding = '20px';
                    empty.style.color = '#666';
                    empty.textContent = 'No DM conversations yet. Click "New DM" to start one!';
                    sidebarItems.appendChild(empty);
                }
            }
        }

        // Show node selector for starting a new DM
        function showNodeSelector() {
            showingNodeSelect = true;
            sidebarItems.innerHTML = '';

            // Add "Back" button
            const backBtn = document.createElement('button');
            backBtn.className = 'new-dm-btn';
            backBtn.textContent = '⬅️ Back to DMs';
            backBtn.onclick = rebuildSidebar;
            sidebarItems.appendChild(backBtn);

            // Add filter input
            const filterInput = document.createElement('input');
            filterInput.type = 'text';
            filterInput.className = 'node-filter-input';
            filterInput.placeholder = 'Filter nodes by name or ID...';
            filterInput.addEventListener('input', (e) => {
                filterNodeList(e.target.value.toLowerCase());
            });
            sidebarItems.appendChild(filterInput);

            // Add all nodes (except ourselves) as selectable items
            const sortedNodes = Object.entries(nodeMap)
                .filter(([nodeNum, _]) => parseInt(nodeNum) !== myNodeNumber)
                .sort((a, b) => {
                    // Sort by shortName
                    const nameA = a[1].shortName || `Node ${a[0]}`;
                    const nameB = b[1].shortName || `Node ${b[0]}`;
                    return nameA.localeCompare(nameB);
                });

            if (sortedNodes.length === 0) {
                const empty = document.createElement('div');
                empty.style.padding = '20px';
                empty.style.color = '#666';
                empty.textContent = 'No nodes available. Wait for nodes to appear on the network.';
                sidebarItems.appendChild(empty);
                return;
            }

            sortedNodes.forEach(([nodeNum, node]) => {
                const item = document.createElement('div');
                item.className = 'node-select-item';
                item.setAttribute('data-node-num', nodeNum);
                item.setAttribute('data-short-name', (node.shortName || '').toLowerCase());
                item.setAttribute('data-long-name', (node.longName || '').toLowerCase());
                item.setAttribute('data-node-id', (node.id || '').toLowerCase());

                const shortName = node.shortName || `Node ${nodeNum}`;
                const longName = node.longName || '';

                item.innerHTML = `<div class="node-short">${shortName}</div>`;
                if (longName && longName !== shortName) {
                    item.innerHTML += `<div class="node-long">${longName}</div>`;
                }

                item.onclick = () => {
                    rebuildSidebar();
                    selectDM(parseInt(nodeNum));
                };
                sidebarItems.appendChild(item);
            });

            // Auto-focus the filter input
            setTimeout(() => filterInput.focus(), 100);
        }

        // Filter node list based on search query
        function filterNodeList(query) {
            const nodeItems = document.querySelectorAll('.node-select-item');
            let visibleCount = 0;

            nodeItems.forEach(item => {
                const shortName = item.getAttribute('data-short-name') || '';
                const longName = item.getAttribute('data-long-name') || '';
                const nodeId = item.getAttribute('data-node-id') || '';
                const nodeNum = item.getAttribute('data-node-num') || '';

                // Check if query matches any field
                const matches = shortName.includes(query) ||
                               longName.includes(query) ||
                               nodeId.includes(query) ||
                               nodeNum.includes(query);

                if (matches) {
                    item.style.display = '';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });

            // Show "no results" message if nothing matches
            const existingNoResults = document.querySelector('.no-results-message');
            if (existingNoResults) {
                existingNoResults.remove();
            }

            if (visibleCount === 0 && query.length > 0) {
                const noResults = document.createElement('div');
                noResults.className = 'no-results-message';
                noResults.style.padding = '20px';
                noResults.style.color = '#666';
                noResults.textContent = `No nodes match "${query}"`;
                sidebarItems.appendChild(noResults);
            }
        }

        // Select a channel
        function selectChannel(channelIndex) {
            currentSelection = channelIndex;

            // Update sidebar active state
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            // Find and activate the correct sidebar item
            const sidebarItem = Array.from(document.querySelectorAll('.sidebar-item'))
                .find(item => item.textContent.includes(channelMap[channelIndex]));
            if (sidebarItem) {
                sidebarItem.classList.add('active');
            }

            // Update chat header
            chatHeader.textContent = `📡 ${channelMap[channelIndex]}`;

            // Filter and display messages for this channel
            displayMessages(allMessages.filter(msg =>
                !msg.is_dm && msg.channel_index === channelIndex
            ));
        }

        // Select a DM conversation
        function selectDM(nodeNum) {
            currentSelection = nodeNum;

            // Update sidebar active state
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            // Find and activate the sidebar item for this DM
            const nodeDisplayName = getNodeDisplayName(nodeNum);
            const sidebarItem = Array.from(document.querySelectorAll('.sidebar-item'))
                .find(item => item.textContent.includes(nodeDisplayName));
            if (sidebarItem) {
                sidebarItem.classList.add('active');
            }

            // Update chat header
            chatHeader.textContent = `💬 ${getNodeDisplayName(nodeNum)}`;

            // Filter and display messages for this DM conversation
            // Show messages between me and the selected node
            // Use dmMessages which has the full DM history (not limited to last 100 overall messages)
            const filteredMessages = dmMessages.filter(msg =>
                (msg.from === myNodeNumber && msg.to === nodeNum) ||
                (msg.from === nodeNum && msg.to === myNodeNumber)
            );
            displayMessages(filteredMessages);
        }

        // Display messages in the chat area
        function displayMessages(messages) {
            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div class="empty-state">No messages yet</div>';
                return;
            }

            messages.forEach(msg => {
                const msgEl = document.createElement('div');
                msgEl.className = 'message';
                if (msg.packet_id) {
                    msgEl.setAttribute('data-packet-id', msg.packet_id);
                }

                const timeStr = msg.time !== 'unknown' ? formatTime(msg.time) : 'unknown time';
                const senderName = getNodeDisplayName(msg.from);
                const senderTooltip = getNodeTooltip(msg.from);

                // Mark outgoing messages
                if (msg.from === myNodeNumber) {
                    msgEl.classList.add('outgoing');
                } else if (msg.is_dm) {
                    msgEl.classList.add('dm');
                }

                // Build status indicator for outgoing DMs
                let statusHTML = '';
                if (msg.from === myNodeNumber && msg.is_dm && msg.packet_id) {
                    const status = messageStatus[msg.packet_id] || 'pending';
                    let statusIcon = '';
                    let statusText = '';
                    if (status === 'pending') {
                        statusIcon = '⏳';
                        statusText = 'Pending';
                    } else if (status === 'ack') {
                        statusIcon = '✓';
                        statusText = 'Delivered';
                    } else if (status === 'nak') {
                        statusIcon = '✗';
                        statusText = 'Failed';
                    }
                    statusHTML = `<span class="message-status ${status}">${statusIcon} ${statusText}</span>`;
                }

                msgEl.innerHTML = `[${timeStr}] From <span title="${senderTooltip}">${senderName}</span>: ${msg.text}${statusHTML}`;
                messagesContainer.appendChild(msgEl);
            });

            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Format Unix timestamp to readable time
        function formatTime(unixTime) {
            const date = new Date(unixTime * 1000);
            const options = {
                timeZone: 'America/Los_Angeles',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return date.toLocaleString('en-US', options);
        }

        // Get display name for a node number
        function getNodeDisplayName(nodeNum) {
            const node = nodeMap[nodeNum];
            if (node && node.shortName) {
                return node.shortName;
            }
            return `Node ${nodeNum}`;
        }

        // Get tooltip for a node number
        function getNodeTooltip(nodeNum) {
            const node = nodeMap[nodeNum];
            if (node) {
                let tooltip = '';
                if (node.longName) tooltip += node.longName;
                if (node.id) tooltip += (tooltip ? '\n' : '') + `ID: ${node.id}`;
                if (tooltip) return tooltip;
            }
            return `Node ${nodeNum}`;
        }

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('get_nodes');  // Request node list on connect
            socket.emit('get_channels');  // Request channel list on connect
            socket.emit('get_message_history');  // Request message history on connect
            socket.emit('get_my_node_number');  // Request our own node number
        });

        socket.on('my_node_number', (data) => {
            myNodeNumber = data.node_number;
            console.log(`My node number: ${myNodeNumber}`);
            // Rebuild sidebar now that we have our node number
            if (allMessages.length > 0) {
                rebuildSidebar();
            }
        });

        socket.on('message_history', (data) => {
            console.log(`Loading message history: ${data.total_count} total messages in database`);

            // Store all messages
            allMessages = data.all;
            dmMessages = data.dms || [];

            // Populate nodeMap from enriched message data (fills in nodes not in live node list)
            const allMsgs = [].concat(data.all || [], data.dms || []);
            allMsgs.forEach(msg => {
                if (msg.from_name && !nodeMap[msg.from]) {
                    nodeMap[msg.from] = {
                        shortName: msg.from_name,
                        longName: msg.from_long_name,
                        id: msg.from_id
                    };
                }
                if (msg.to_name && !nodeMap[msg.to]) {
                    nodeMap[msg.to] = {
                        shortName: msg.to_name,
                        longName: msg.to_long_name,
                        id: msg.to_id
                    };
                }
            });

            // Rebuild sidebar to show DM conversations (if we have our node number)
            if (myNodeNumber !== null) {
                rebuildSidebar();
            }

            // Auto-select first channel if in channels mode
            if (currentMode === 'channels' && Object.keys(channelMap).length > 0) {
                selectChannel(parseInt(Object.keys(channelMap)[0]));
            }

            console.log(`Loaded ${data.all.length} messages`);
        });

        socket.on('channel_list', (data) => {
            // Build channel map
            channelMap = {};
            data.channels.forEach(channel => {
                channelMap[channel.index] = channel.name;
            });

            // Rebuild sidebar
            rebuildSidebar();

            console.log(`Loaded ${data.channels.length} channels`);
        });

        socket.on('node_list', (data) => {
            // Build node map for message display
            data.nodes.forEach(node => {
                nodeMap[node.num] = {
                    shortName: node.user?.shortName,
                    longName: node.user?.longName,
                    id: node.user?.id
                };
            });

            console.log(`Loaded ${data.nodes.length} nodes into nodeMap`);

            // Rebuild sidebar now that we have node names
            if (currentMode === 'dms' && allMessages.length > 0 && myNodeNumber !== null) {
                rebuildSidebar();
            }
        });

        socket.on('new_message', (data) => {
            // Skip messages from ourselves to avoid echo (we already display them immediately)
            if (myNodeNumber && data.from === myNodeNumber) {
                console.log('Skipping echo of own message');
                return;
            }

            // Determine if this is a DM or channel message
            const isDM = data.to !== 4294967295 && data.to !== '^all'; // 0xffffffff = 4294967295
            const channelIndex = data.channel || 0;

            // Add to allMessages array
            const newMsg = {
                from: data.from,
                to: data.to,
                text: data.text,
                time: data.time,
                is_dm: isDM,
                channel_index: channelIndex
            };
            allMessages.push(newMsg);
            if (isDM) {
                dmMessages.push(newMsg);
            }

            // Update sidebar if this is a new DM conversation
            if (isDM && currentMode === 'dms') {
                rebuildSidebar();
            }

            // If we're currently viewing this channel or DM, refresh the display
            if (currentSelection !== null) {
                if (currentMode === 'channels' && !isDM && channelIndex === currentSelection) {
                    // Refresh current channel view
                    displayMessages(allMessages.filter(msg =>
                        !msg.is_dm && msg.channel_index === currentSelection
                    ));
                } else if (currentMode === 'dms' && isDM) {
                    // Check if this message is part of the currently viewed DM conversation
                    if ((data.from === myNodeNumber && data.to === currentSelection) ||
                        (data.from === currentSelection && data.to === myNodeNumber)) {
                        // Refresh current DM view
                        displayMessages(dmMessages.filter(msg =>
                            (msg.from === myNodeNumber && msg.to === currentSelection) ||
                            (msg.from === currentSelection && msg.to === myNodeNumber)
                        ));
                    }
                }
            }

            console.log(`Received message: ${isDM ? 'DM' : 'channel'} from ${data.from}`);
        });

        socket.on('message_ack', (data) => {
            // Update message status when ACK/NAK is received
            const packetId = data.packet_id;
            const status = data.status; // 'ack' or 'nak'

            console.log(`Received ${status.toUpperCase()} for packet ${packetId}`);

            // Update status tracking
            messageStatus[packetId] = status;

            // Find the message in allMessages and dmMessages and update it
            const msgIndex = allMessages.findIndex(msg => msg.packet_id === packetId);
            if (msgIndex !== -1) {
                allMessages[msgIndex].ack_status = status;
            }
            const dmMsgIndex = dmMessages.findIndex(msg => msg.packet_id === packetId);
            if (dmMsgIndex !== -1) {
                dmMessages[dmMsgIndex].ack_status = status;
            }

            // Update the UI if we're currently viewing this conversation
            if (currentSelection !== null && currentMode === 'dms') {
                displayMessages(dmMessages.filter(msg =>
                    (msg.from === myNodeNumber && msg.to === currentSelection) ||
                    (msg.from === currentSelection && msg.to === myNodeNumber)
                ));
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();

            // Check if a channel or DM is selected
            if (!currentSelection && currentSelection !== 0) {
                alert('Please select a channel or DM first');
                return;
            }

            if (!text) return;

            // Determine recipient based on current mode and selection
            let recipient;
            if (currentMode === 'channels') {
                recipient = `channel:${currentSelection}`;
            } else {
                recipient = currentSelection; // node number
            }

            // Add to allMessages array immediately (will be updated with packet_id later)
            const now = Math.floor(Date.now() / 1000);
            const newMsg = {
                from: myNodeNumber,
                to: currentMode === 'channels' ? 4294967295 : currentSelection,
                text: text,
                time: now,
                is_dm: currentMode === 'dms',
                channel_index: currentMode === 'channels' ? currentSelection : 0,
                packet_id: null  // Will be set when server responds
            };
            const msgIndex = allMessages.length;
            allMessages.push(newMsg);
            if (newMsg.is_dm) {
                dmMessages.push(newMsg);
            }

            // Send the message and wait for packet_id
            socket.emit('send_message', {
                text: text,
                recipient: recipient
            });

            // Listen for the message_sent response to get packet_id
            socket.once('message_sent', (response) => {
                if (response.status === 'success' && response.packet_id) {
                    // Update the message with its packet_id
                    allMessages[msgIndex].packet_id = response.packet_id;

                    // Mark as pending for DMs
                    if (currentMode === 'dms') {
                        messageStatus[response.packet_id] = 'pending';

                        // Refresh display to show pending status
                        displayMessages(dmMessages.filter(msg =>
                            (msg.from === myNodeNumber && msg.to === currentSelection) ||
                            (msg.from === currentSelection && msg.to === myNodeNumber)
                        ));
                    }

                    console.log(`Message sent with packet ID: ${response.packet_id}`);
                }
            });

            // Refresh the current view to show the sent message
            if (currentMode === 'channels') {
                displayMessages(allMessages.filter(msg =>
                    !msg.is_dm && msg.channel_index === currentSelection
                ));
            } else {
                displayMessages(dmMessages.filter(msg =>
                    (msg.from === myNodeNumber && msg.to === currentSelection) ||
                    (msg.from === currentSelection && msg.to === myNodeNumber)
                ));
                // Rebuild sidebar so new DM conversation appears immediately
                rebuildSidebar();
            }

            // Clear input
            messageInput.value = '';
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Refresh node list every 30 seconds
        setInterval(() => {
            socket.emit('get_nodes');
        }, 30000);
    </script>
</body>
</html>
